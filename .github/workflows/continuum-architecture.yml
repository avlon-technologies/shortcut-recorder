# continuum-managed-workflow/1 — generated by `continuum install` from the toolchain's tooling/ci template; regenerate with `continuum update`.
# Continuum architecture gate — a template for TARGET repositories.
#
# Copy to `.github/workflows/continuum-architecture.yml` in the repo
# whose architecture is modelled under `continuum/`, and set
# CONTINUUM_REPO/CONTINUUM_REF below to the toolchain checkout you
# want pinned.
#
# WHY THIS EXISTS: a model is a claim about a repository at one commit.
# Without a gate, nothing compiles it between the commit that authors
# it and the day someone needs it — and a model that silently stopped
# compiling supports no architecture answers at all. This job makes the
# model a checked artifact: it must compile on every change, and on a
# pull request the architectural delta is computed as a VERIFIED
# architecture-change/1 ChangeSet and posted for review.
#
# The gate never re-judges anything: it runs the conforming toolchain
# and reports what came back (adlc's exit code is the verdict).
name: continuum-architecture

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write   # only needed for the delta comment

env:
  # The Continuum toolchain checkout to pin. Replace with your fork or
  # a tag; pinning a ref (never a moving branch) is what keeps the gate
  # reproducible and stops a toolchain-era move from surprising you.
  CONTINUUM_REPO: avlon-technologies/continuum
  CONTINUUM_REF: 770114cb6edbc7bee8e2c62735c18884bb8ffab3   # pinned by continuum install — see continuum/toolchain.json
  # The model this repository owns.
  MODEL_MANIFEST: continuum/model/*.adl-manifest.json

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the PR base is needed for the delta

      - name: Check out the Continuum toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONTINUUM_REPO }}
          ref: ${{ env.CONTINUUM_REF }}
          path: .continuum-toolchain
          # token: ${{ secrets.CONTINUUM_TOKEN }}   # uncomment if private

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve the model manifest
        id: model
        run: |
          manifest=$(ls ${{ env.MODEL_MANIFEST }} 2>/dev/null | head -1)
          if [ -z "$manifest" ]; then
            echo "No Continuum model found under continuum/model/ — nothing to gate." >&2
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          fi

      # THE GATE: the model must compile. Errors fail the build; warnings
      # are lawful (a model may be valid and incomplete) and are printed.
      - name: Compile the architecture model
        if: steps.model.outputs.present == 'true'
        run: |
          node .continuum-toolchain/tools/adlc.mjs "${{ steps.model.outputs.manifest }}" --state

      # THE GUARD (v2): when the repository carries a development package
      # at continuum/, the same verification the pre-push hook runs is
      # authoritative here — so `git commit --no-verify` cannot slip an
      # unverified state onto a protected branch: package inventory and
      # rebuild, the ledger's lineage, every pending transition against the
      # current state, the complete acceptance suite on the fake adapter.
      # Mechanical rows only; the guard never mutates a tracked file.
      - name: Architecture Guard
        if: hashFiles('continuum/PACKAGE.json') != ''
        run: |
          node .continuum-toolchain/tools/continuum.mjs guard ci

      # THE DELTA: what architectural change does this PR introduce?
      # Recover the base-side model, generate the ChangeSet, and verify
      # apply(A, Δ) = B mechanically. A failure here means the two
      # states are not connected by a representable transition — worth
      # knowing, never fatal to the PR.
      - name: Compute the architectural delta
        id: delta
        if: github.event_name == 'pull_request' && steps.model.outputs.present == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          base=$(mktemp -d)
          git worktree add --detach "$base" "${{ github.event.pull_request.base.sha }}"
          basemf=$(ls "$base"/continuum/model/*.adl-manifest.json 2>/dev/null | head -1)
          if [ -z "$basemf" ]; then
            echo "summary=The base commit carries no Continuum model; this PR introduces the first one." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node .continuum-toolchain/tools/adlc.mjs "$basemf" \
            --diff "${{ steps.model.outputs.manifest }}" --json --quiet > delta.json || true
          node -e '
            const d = JSON.parse(require("fs").readFileSync("delta.json", "utf8"));
            if (!d.ok) { console.log("refused: " + d.reason); process.exit(0); }
            const ops = d.changeSet["change-set"].operations;
            const byKind = ops.reduce((m, o) => (m[o.op] = (m[o.op] ?? 0) + 1, m), {});
            console.log(`operations: ${ops.length} — ` +
              Object.entries(byKind).map(([k, n]) => `${k} ${n}`).join(", "));
            console.log(`verified: ${d.verified} (apply: ${d.applyStatus})`);
            console.log(`base:   ${d.base}`);
            console.log(`result: ${d.result}`);
          ' | tee delta.txt
          {
            echo 'summary<<EOF'
            cat delta.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
          git worktree remove --force "$base"

      - name: Post the architectural delta
        if: github.event_name == 'pull_request' && steps.delta.outputs.summary != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### Architectural change',
              '',
              '```',
              process.env.SUMMARY,
              '```',
              '',
              '_Generated by the Continuum toolchain: the delta is a verified',
              '`architecture-change/1` ChangeSet — `apply(A, Δ) = B` was checked',
              'mechanically. Renames and moves preserve element identity; a',
              'remove+add pair means one element ended and another began._',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number });
            const mine = comments.find((c) => c.body.startsWith('### Architectural change'));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
        env:
          SUMMARY: ${{ steps.delta.outputs.summary }}
